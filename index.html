const compareByFilter = document.getElementById('compareByFilter');
const lockerFilter = document.getElementById('lockerFilter');
const cohortPicker = document.getElementById('cohortPicker');

DATA.dimension_options.forEach(function(pair) {
  const opt = document.createElement('option');
  opt.value = pair[0];
  opt.textContent = pair[1];
  compareByFilter.appendChild(opt);
});

DATA.locker_options.forEach(function(lt) {
  const opt = document.createElement('option');
  opt.value = lt;
  opt.textContent = (lt === 'All') ? 'All Lockers' : lt;
  lockerFilter.appendChild(opt);
});

// "All" (pooled, balance-weighted across every cohort) is checked by
// default; individual cohorts start unchecked. Any combination of boxes
// can be checked at once -- each checked cohort renders as its own
// stacked mini-grid below the pooled one (if pooled is also checked).
const cohortCheckboxes = {};
function addCohortCheckbox(value, label, checked) {
  const wrapper = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = checked;
  cb.addEventListener('change', renderGrid);
  cohortCheckboxes[value] = cb;
  wrapper.appendChild(cb);
  wrapper.appendChild(document.createTextNode(label));
  cohortPicker.appendChild(wrapper);
}
addCohortCheckbox('All', 'All Cohorts (pooled)', true);
DATA.cohort_options.forEach(function(c) { addCohortCheckbox(c, c, false); });

function pctCellColor(pct) {
  if (pct === null || pct === undefined) return { bg: 'transparent', fg: 'var(--muted)' };
  const clamped = Math.max(0, Math.min(pct, 20)) / 20;
  const stops = [
    [0.0, [12, 163, 12]],
    [0.5, [154, 149, 43]],
    [1.0, [208, 59, 59]],
  ];
  let lo = stops[0], hi = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (clamped >= stops[i][0] && clamped <= stops[i + 1][0]) { lo = stops[i]; hi = stops[i + 1]; break; }
  }
  const span = hi[0] - lo[0] || 1;
  const t = (clamped - lo[0]) / span;
  const rgb = lo[1].map(function(c, i) { return Math.round(c + (hi[1][i] - c) * t); });
  return { bg: 'rgb(' + rgb.join(',') + ')', fg: '#0d0d0d' };
}

function formatBalance(v) {
  if (v === null || v === undefined) return '';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M BDT';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'k BDT';
  return v.toFixed(0) + ' BDT';
}

function renderOneGrid(grid, showBalanceCol) {
  let html = '<table class="data-table"><thead><tr><th>MOB</th>';
  grid.groups.forEach(function(g) { html += '<th>' + g + '</th>'; });
  if (showBalanceCol) html += '<th>Eligible Balance</th>';
  html += '</tr></thead><tbody>';
  grid.mobs.forEach(function(mob, i) {
    html += '<tr><td>' + mob + '</td>';
    grid.values[i].forEach(function(v, j) {
      const c = pctCellColor(v);
      const text = (v === null) ? '' : v.toFixed(2) + '%';
      const n = grid.n_cohorts[i][j];
      const title = n ? (n + ' cohort' + (n === 1 ? '' : 's')) : '';
      html += '<td title="' + title + '" style="background:' + c.bg + ';color:' + c.fg + ';text-align:center;">' + text + '</td>';
    });
    if (showBalanceCol) {
      html += '<td>' + formatBalance(grid.eligible_balance[i]) + '</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function renderGrid() {
  const dimKey = compareByFilter.value;
  const locker = lockerFilter.value;
  const dim = DATA.dimensions[dimKey];
  const lockerLabel = (locker === 'All') ? 'All Lockers' : locker;
  document.getElementById('gridTitle').textContent = 'Weighted DPD by Month-on-Book — ' + dim.label + ' × ' + lockerLabel;

  const lockerData = dim.by_locker[locker];
  const selected = Object.keys(cohortCheckboxes).filter(function(k) { return cohortCheckboxes[k].checked; });

  let html = '';
  if (selected.length === 0) {
    html = '<p style="color:var(--muted)">Select at least one cohort.</p>';
  } else {
    selected.forEach(function(cohort) {
      const grid = lockerData ? lockerData.by_cohort[cohort] : undefined;
      const label = (cohort === 'All') ? 'All Cohorts (pooled)' : cohort;
      html += '<div class="cohort-block"><h3>' + label + '</h3>';
      if (!grid) {
        html += '<p style="color:var(--muted)">No data.</p>';
      } else {
        html += renderOneGrid(grid, cohort === 'All');
      }
      html += '</div>';
    });
  }
  document.getElementById('mobGrid').innerHTML = html;
}

const crossMobFilter = document.getElementById('crossMobFilter');
DATA.cross_mobs.forEach(function(mob) {
  const opt = document.createElement('option');
  opt.value = String(mob);
  opt.textContent = 'MOB ' + mob;
  crossMobFilter.appendChild(opt);
});
if (DATA.cross_mobs.indexOf(4) !== -1) crossMobFilter.value = '4';

function renderCrossGrid() {
  const mob = crossMobFilter.value;
  const grid = DATA.cross_grids[mob];
  if (!grid) { document.getElementById('crossGrid').innerHTML = ''; return; }

  let html = '<table class="data-table"><thead><tr><th>Price \\ Downpayment</th>';
  grid.dp_bands.forEach(function(db) { html += '<th>' + db + '</th>'; });
  html += '</tr></thead><tbody>';
  grid.price_bands.forEach(function(pb, i) {
    html += '<tr><td>' + pb + '</td>';
    grid.values[i].forEach(function(v, j) {
      const c = pctCellColor(v);
      const text = (v === null) ? '' : v.toFixed(2) + '%';
      const n = grid.n_cohorts[i][j];
      const bal = grid.eligible_balance[i][j];
      const title = n ? (n + ' cohort' + (n === 1 ? '' : 's') + ', ' + formatBalance(bal)) : '';
      html += '<td title="' + title + '" style="background:' + c.bg + ';color:' + c.fg + ';text-align:center;">' + text + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('crossGrid').innerHTML = html;
}

compareByFilter.addEventListener('change', renderGrid);
lockerFilter.addEventListener('change', renderGrid);
crossMobFilter.addEventListener('change', renderCrossGrid);

renderGrid();
renderCrossGrid();
</script>
